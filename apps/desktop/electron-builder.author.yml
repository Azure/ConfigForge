## electron-builder configuration for the macOS author-only flavor.
##
## Diffs from the standard electron-builder.yml that ships the
## Windows + Linux deploy-capable build:
##
##   1. Distinct appId / productName / executableName so the author
##      build can be installed alongside the full build without
##      collision (different LaunchServices entry, different Dock
##      icon, different About-pane name).
##
##   2. extraResources drops the `oscfg-resources/oscfg/` glob —
##      the author flavor bundles no oscfg CLI (~30-50 MB) because
##      it cannot deploy / audit / enforce on a device. Phase 2's
##      tree-shaking already stripped the deploy.ts code paths
##      from main.js; this drops the binaries from the .dmg too.
##      public-assets/_baselines/ stays so the bundled Microsoft
##      baselines are still browsable + usable as templates.
##
##   3. Mac-only target. ARM64 only for Apple Silicon Macs (M1 or later).
##      No Intel x64 or universal artifact is produced.
##
##   4. Unsigned. `identity: null` skips code signing for the
##      v0.2.0-author preview — Gatekeeper will block first launch
##      and the user must right-click → Open. Signing requires an
##      Apple Developer cert ($99/year) — out of scope for the
##      preview, planned as a follow-up if usage justifies it.
##
##   5. No win:/linux:/nsis:/rpm:/deb:/fpm: blocks. Those targets
##      are owned by the standard config; this file is Mac-only.
##
## Build command (must run on macOS — electron-builder cannot
## produce a Mac .dmg from Windows or Linux):
##   cd apps/desktop
##   npm run dist:mac:author

appId: community.configforge.author
productName: ConfigForge Author
executableName: configforge-author
copyright: Copyright (c) Microsoft Corporation

directories:
  output: release/${version}-author
  buildResources: build

# Same `files` block as the full config — the renderer dist + the
# package.json descriptor + workspace symlink exclusions. The
# Phase 2 tree-shaking happens at the esbuild step before this
# config is consulted, so by the time electron-builder reads
# `dist/electron/main.js` the deploy code is already gone.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!node_modules/@configforge/**'

asar: true

# pdfkit ships AFM font metric files inside its package dir and
# reads them with fs.readFileSync at runtime. asar-packed paths
# don't support direct fs.readFileSync, so unpack pdfkit into
# app.asar.unpacked/. Same as the full config — the audit-pack
# PDF generator runs on the author flavor too.
asarUnpack:
  - 'node_modules/pdfkit/**/*'

# NO oscfg-resources/oscfg/ block here — the author flavor has no
# CLI binary to bundle. Drops ~30-50 MB from the .dmg payload.
#
# public-assets/_baselines/ stays so the bundled Microsoft
# baselines (defender, laps, secured-core, sff-linux,
# ws2016-2025) are still readable for "Use as Template" + the
# in-app reference-baseline compliance comparison.
extraResources:
  - from: ../../public
    to: public-assets
    filter:
      - '_baselines/**/*.osc.yaml'
      - '_baselines/**/*.csv'
      - '_baselines/cis/_data/**/*'

mac:
  # ARM64 only for Apple Silicon Macs (M1 or later).
  # Intel Macs are not supported; no x64 or universal target is built.
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # Hardened runtime is recommended by Apple even for unsigned
  # apps — it enforces some baseline runtime protections (no
  # arbitrary library loading, etc.) that don't materially
  # affect Electron. When we add signing + notarization in a
  # later release this will already be in place.
  hardenedRuntime: true
  # Tell Gatekeeper not to bother assessing during the build —
  # the build itself is unsigned, so any assessment would fail
  # noisily. The first-launch right-click → Open dance is the
  # documented workaround for users.
  gatekeeperAssess: false
  # `identity: null` disables codesigning entirely. macOS Sequoia
  # + Apple Silicon will show "is damaged and can't be opened"
  # for the downloaded .dmg — see release notes for the
  # `xattr -cr` workaround. Ad-hoc signing (`identity: '-'`) was
  # tried in v0.2.0-author.dev2 but electron-builder treats '-'
  # as a literal keychain identity name, finds nothing, and
  # silently skips signing — so the .dmg ends up byte-identical
  # to the `null` case anyway. The real fix is a Developer ID
  # cert + notarization; deferred to a follow-up since the
  # preview is fine with the documented workaround.
  identity: null
  # Mac doesn't support .ico — point at the 512×512 PNG already
  # generated by `npm run icons`. electron-builder auto-converts
  # to .icns at packaging time on macOS.
  icon: build/icon.png
  artifactName: ConfigForge-Author-${version}-mac-${arch}.${ext}

# Release notes embedded in `latest-mac.yml` for updater metadata.
# electron-builder reads the file relative to `apps/desktop`.
releaseInfo:
  releaseNotesFile: build/release-notes-author.md

dmg:
  # Two-pane Applications-folder drag layout. Standard Mac DMG
  # UX — drag the app icon onto Applications to install.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  # Compact .dmg without the volume-icon background image. Easy
  # to add later; the bare layout is plenty for a preview.
  window:
    width: 540
    height: 380

# Same publish target as the full config so the author .dmg
# uploads to the same draft GitHub release. release.yml will
# add a macos-latest job in Phase 4 that pulls + uploads.
publish:
  provider: github
  owner: Azure
  repo: ConfigForge
  releaseType: draft
