name: Release (macOS author)

# macOS-only release builder for the `mac-author-build` flavor.
#
# Separate from release.yml because:
#   1. macos-latest runners are billed at 10x the ubuntu rate — opt-in only.
#   2. The mac flavor uses a different electron-builder config
#      (electron-builder.author.yml) with a different appId / productName.
#   3. The tag pattern is `mac-v*` so it doesn't accidentally trigger
#      release.yml (which builds Win/Linux from `v*.*.*` tags).
#
# Trigger: workflow_dispatch only. Run the workflow definition from protected `main`;
# the checkout step below switches to and verifies the supplied immutable mac tag.
# CLI: `gh workflow run "Release (macOS author)" --ref main -f release_tag=mac-v0.3.93-author.2`
# The protected main copy of the public packaging guard checks the tagged tree
# before npm install or electron-builder runs.
#
# Build cost estimate: ~15-20 min wall-clock on macos-latest → ~150-200 ubuntu-equivalent minutes
# (macos-latest carries a 10x billing multiplier vs ubuntu-latest).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing mac-vX.Y.Z-author.N tag to build. The matching release must already exist as a draft.'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build-mac:
    name: Build macOS .dmg (arm64, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify release tag checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^mac-v[0-9]+\.[0-9]+\.[0-9]+-author\.[0-9]+$ ]]; then
            echo "::error::release_tag must match mac-vX.Y.Z-author.N"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test -n "$tag_commit"
          test "$(git rev-parse HEAD)" = "$tag_commit"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The job source is the immutable mac tag, while this workflow definition
      # comes from protected main. Check out the current dependency-free guard
      # separately so older tags cannot bypass a newly added packaging policy.
      - name: Check out protected packaging guard
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-policy
          sparse-checkout: scripts/verify-public-package-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Verify public packaging policy
        run: node .release-policy/scripts/verify-public-package-assets.mjs --root .

      - name: Install
        run: npm ci

      # Parity with release.yml — fail the build if any prod dep has a
      # HIGH or CRITICAL advisory (CF-SEC-014). Moderate/low pass through.
      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      # esbuild for the electron main bundle resolves @configforge/core
      # subpaths against the compiled tsc output. Without this step,
      # build:electron fails with "Could not resolve @configforge/core/handlers"
      # etc. The release.yml workflow has this same step for Win/Linux.
      - name: Build core (workspace dep needed by electron main bundle)
        run: npm run core:build

      # Build the mac author flavor. `npm run dist:mac:author` chains:
      #   npm run icons -> npm run build:author -> electron-builder --mac
      # `--publish never` keeps electron-builder from auto-uploading; we
      # upload manually below to control the target release tag.
      - name: Build macOS .dmg
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm run icons
          npm run build:author
          npx --no-install electron-builder --mac \
            --config=electron-builder.author.yml \
            --publish never

      # Generate CycloneDX SBOM (production deps only) to match the
      # Win/Linux release artifacts (CF-SEC-012).
      - name: Generate SBOM (CycloneDX, production deps)
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/release
          out="apps/desktop/release/sbom-macos-author.cdx.json"
          npx --no-install @cyclonedx/cyclonedx-npm \
            --omit dev \
            --output-format JSON \
            --output-file "$out"
          if ! grep -q '"components"' "$out"; then
            echo "::error::SBOM generation produced no components array. Check cyclonedx-npm output."
            exit 1
          fi
          echo "[release-mac] SBOM written: $out ($(wc -c < "$out") bytes)"

      # Generate SHA256SUMS over the .dmg + .blockmap output.
      # `release/<version>-author/` is the directory electron-builder.author.yml
      # configures via `directories.output`.
      - name: Generate SHA256SUMS (macOS)
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            printf '%s  %s\n' \
              "$(shasum -a 256 "$file" | awk '{print $1}')" \
              "$(basename "$file")"
          done < <(
            find . -maxdepth 2 -type f \( \
                -name '*.dmg' -o -name '*.dmg.blockmap' \
                -o -name 'latest-mac.yml' \
              \) ! -name 'SHA256SUMS*.txt' -print \
              | LC_ALL=C sort
          ) > SHA256SUMS-macos-author.txt
          cat SHA256SUMS-macos-author.txt

      # Attach to the existing draft release (e.g. mac-v0.3.93-author.2).
      # `--clobber` overwrites if a re-run uploads the same filename.
      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Verify the release exists and is still a draft. We never
          # create or publish a release from this workflow.
          if ! draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "::error::Release '$TAG' does not exist. Create it as a draft first (gh release create $TAG --draft --verify-tag)."
            exit 1
          fi
          if [[ "$draft" != "true" ]]; then
            echo "::error::Release '$TAG' is published. Refusing to replace its assets."
            exit 1
          fi
          cd apps/desktop/release
          shopt -s nullglob
          assets=()
          # mac artifacts live under release/<version>-author/
          while IFS= read -r -d '' f; do assets+=("$f"); done < <(find . -maxdepth 2 -type f \( \
            -name '*.dmg' -o -name '*.dmg.blockmap' \
            -o -name 'latest-mac.yml' \
            -o -name 'SHA256SUMS-macos-author.txt' \
            -o -name 'sbom-macos-author.cdx.json' \
          \) -print0)
          if [[ ${#assets[@]} -ne 5 ]]; then
            echo "::error::Expected exactly 5 macOS author assets; found ${#assets[@]}."
            find . -maxdepth 2 -type f -print
            exit 1
          fi
          version="${TAG#mac-v}"
          expected=(
            "ConfigForge-Author-${version}-mac-arm64.dmg"
            "ConfigForge-Author-${version}-mac-arm64.dmg.blockmap"
            "latest-mac.yml"
            "sbom-macos-author.cdx.json"
            "SHA256SUMS-macos-author.txt"
          )
          found=()
          for asset in "${assets[@]}"; do found+=("$(basename "$asset")"); done
          for name in "${expected[@]}"; do
            present=false
            for candidate in "${found[@]}"; do
              if [[ "$candidate" == "$name" ]]; then
                present=true
                break
              fi
            done
            if [[ "$present" != "true" ]]; then
              echo "::error::Missing expected asset: $name"
              printf 'Found: %s\n' "${found[@]}"
              exit 1
            fi
          done
          echo "[release-mac] uploading ${#assets[@]} files to $TAG"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber

      # Belt-and-suspenders stash so artifacts are reachable from the
      # workflow run page even if the gh release upload step had a hiccup.
      - name: Stash artifacts as workflow outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos-author
          path: |
            apps/desktop/release/SHA256SUMS-macos-author.txt
            apps/desktop/release/sbom-macos-author.cdx.json
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.dmg.blockmap
            apps/desktop/release/**/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7
