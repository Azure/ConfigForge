name: Temporary author dependency refresh

on:
  push:
    branches: [fix/mac-dependabot-20260915]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Resolve patched dependencies
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          npm install --workspace @configforge/desktop --save-dev --save-prefix='~' electron@42.11.3 --ignore-scripts --include=optional --no-audit --no-fund
          npm update brace-expansion nanoid @xmldom/xmldom --workspaces --include-workspace-root --ignore-scripts --include=optional --no-audit --no-fund
          cp package-lock.json dependency-evidence/package-lock.json
          git diff -- apps/desktop/package.json package-lock.json > dependency-evidence/refresh.diff
          npm audit --json > dependency-evidence/audit.json
      - name: Verify clean install and author build
        run: |
          npm ci --include=optional
          node scripts/verify-public-package-assets.mjs
          npx --no-install vitest run scripts/release-metadata.test.mjs
          npm run core:build
          npm run build:author -w @configforge/desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: author-dependency-evidence
          path: dependency-evidence/
          retention-days: 1
