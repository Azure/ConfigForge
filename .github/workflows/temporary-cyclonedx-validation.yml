name: Temporary CycloneDX release compatibility

on:
  push:
    branches: [fix/mac-cyclonedx-20260917]

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            ref: c8fb672258bae0250ad8d96bbd49856a8d483f87
          - os: ubuntu-latest
            node: '24'
            ref: c8fb672258bae0250ad8d96bbd49856a8d483f87
          - os: windows-latest
            node: '22'
            ref: c8fb672258bae0250ad8d96bbd49856a8d483f87
          - os: macos-14
            node: '22'
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Clean install
        run: npm ci --include=optional
      - name: Validate production SBOM and dependency security
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          npm audit --json > dependency-evidence/audit.json
          npx --no-install @cyclonedx/cyclonedx-npm \
            --omit dev \
            --output-format JSON \
            --output-file dependency-evidence/sbom.cdx.json
          node -e "const assert = require('node:assert/strict'); const bom = require('./dependency-evidence/sbom.cdx.json'); assert.equal(require('./node_modules/@cyclonedx/cyclonedx-npm/package.json').version, '6.0.0'); assert.equal(bom.bomFormat, 'CycloneDX'); assert.ok(Array.isArray(bom.components) && bom.components.length > 0); assert.equal(bom.metadata.component.version, require('./package.json').version); console.log(bom.components.length + ' production components in SBOM');"
          npx --no-install vitest run scripts/release-metadata.test.mjs
          node scripts/verify-public-package-assets.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cyclonedx-${{ matrix.os }}-node-${{ matrix.node }}
          path: dependency-evidence/
          retention-days: 3
