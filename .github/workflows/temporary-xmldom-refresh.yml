name: Temporary xmldom lock refresh

on:
  push:
    branches:
      - fix/dependabot-xmldom-20260915

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Refresh lockfile and inspect upstream versions
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          npm view @xmldom/xmldom@0.8.15 --json > dependency-evidence/xmldom-0.8.15.json
          npm view extract-zip@latest --json > dependency-evidence/extract-zip-latest.json
          npm view electron@latest version dependencies --json > dependency-evidence/electron-latest.json
          npm view electron@42 version dependencies --json > dependency-evidence/electron-42-versions.json
          npm view @electron-internal/extract-zip@latest --json > dependency-evidence/electron-extract-zip.json
          node -p "require('./apps/desktop/package.json').devDependencies.electron"
          npm install --workspace @configforge/desktop --save-dev --save-prefix='~' electron@42.11.3 --ignore-scripts --include=optional --no-audit --no-fund
          npm update brace-expansion nanoid --workspaces --include-workspace-root --ignore-scripts --include=optional --no-audit --no-fund
          cp package-lock.json dependency-evidence/package-lock.json
          git diff -- apps/desktop/package.json package-lock.json > dependency-evidence/refresh.diff
          node -e "const assert = require('node:assert/strict'); const lock = require('./package-lock.json'); assert.equal(lock.packages['apps/desktop'].devDependencies.electron, '~42.11.3'); for (const [p, m] of Object.entries(lock.packages)) { if (p.endsWith('node_modules/@xmldom/xmldom')) assert.equal(m.version, '0.8.15', p); if (p.endsWith('node_modules/electron')) assert.equal(m.version, '42.11.3', p); assert.ok(!p.endsWith('node_modules/extract-zip'), p); }"
          node scripts/verify-public-package-assets.mjs
          npm audit --json > dependency-evidence/audit.json
          npx --no-install vitest run scripts/release-metadata.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xmldom-dependency-evidence
          path: dependency-evidence/
          retention-days: 1
