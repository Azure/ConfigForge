name: Temporary xmldom lock refresh

on:
  push:
    branches:
      - fix/dependabot-xmldom-20260915

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Refresh lockfile and inspect upstream versions
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence
          npm view @xmldom/xmldom@0.8.15 --json > dependency-evidence/xmldom-0.8.15.json
          npm view extract-zip@latest --json > dependency-evidence/extract-zip-latest.json
          npm view electron@latest version dependencies --json > dependency-evidence/electron-latest.json
          npm view electron@42 version dependencies --json > dependency-evidence/electron-42-versions.json
          npm view @electron-internal/extract-zip@latest --json > dependency-evidence/electron-extract-zip.json
          npm install --workspace @configforge/desktop --save-dev --save-prefix='~' electron@42.11.3 --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund
          cp package-lock.json dependency-evidence/package-lock.json
          node -e "const assert = require('node:assert/strict'); const lock = require('./package-lock.json'); assert.equal(lock.packages['apps/desktop/node_modules/@xmldom/xmldom'].version, '0.8.15'); assert.equal(lock.packages['apps/desktop/node_modules/electron'].version, '42.11.3'); assert.ok(!Object.keys(lock.packages).some(p => p.endsWith('node_modules/extract-zip')));"
          npm audit --json > dependency-evidence/audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xmldom-dependency-evidence
          path: dependency-evidence/
          retention-days: 1
