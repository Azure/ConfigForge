name: Temporary lockfile refresh

on:
  push:
    branches:
      - fix/js-yaml-4.3.2-ci-unblock

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Refresh lockfile on hosted runner
        run: npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 1
